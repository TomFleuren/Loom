[package]
name = "loom"
version = "1.0.0"
description = "Loom, a Windows utility"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
