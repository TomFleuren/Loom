name: Bug
description: Something in Loom did not do what it should.
title: ""
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Loom did instead.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Which screen, and whether Loom was running as administrator.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
